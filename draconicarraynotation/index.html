<title>Draconic Array Notation</title>
<h1>Draconic Array Notation</h1>
<button id="dragonSlayer">WIP</button>
<script>
  class Dragon {
    constructor(mutation, horns, heads, type, degree) {
      this.mutation = convertToDragon(mutation);
      this.horns = horns;
      this.heads = heads;
      this.type = type;
      this.degree = convertToDragon(degree);
      this.isDragon = true;
    }
  }
  
  class Myriad {
    constructor(rank, operator, operand) {
      if rank
    }
  }

  function convertToDragon(attribute) {
    if (attribute.isDragon() || attribute.isMyriad() || attribute = null) {
      return attribute;
    } else if (attribute.isInteger()) {
      return D(null, attribute, [], null, null);
    } else if (attribute.isArray()) {
      let attributeStorage = [];
      for (let i = 0; i < attribute[i].length; i++) {
        if (attribute[i] == 0) {
          attributeStorage.push(convertToDragon(attribute[i]));
        } else {
          attributeStorage.push(convertToDragon(attribute[i]));
        }
      }
      return D(null, 0, [...attributeStorage], null, null)
    }
  }
  
  function D(mut, hrn, hds, typ) {
    return new Dragon(mut, hrn, hds, typ);
  }

  function M(rnk, opt, opd) {
    return new Myriad(rnk, opt, opd);
  }
  function slayDragon(a, dragon, b) {
    let dragonOutput = "";
    
    let dragonSlain = convertToDragon(dragon);
    
    if (a == 1) {
      return String(1);
    } else if (b == 1) {
      return String(a);
    } else if (dragonSlain.mutation == null && dragonSlain.horns == 0 && dragonSlain.heads == [] && dragonSlain.type == "") {
      return a + "^" + b;
    } else {
      for (let i = 0; i = b; i++) {
        if (i == 0) {
          dragonOutput = dragonOutput + a;
        } else {
          dragonOutput = dragonOutput + a + dragonToString(dragonSlain.evaluate(b, b, 0, []));
        }
      }
    }

    return dragonOutput;
  }
</script>
