<title>Draconic Array Notation</title>
<h1>Draconic Array Notation</h1>
<button id="dragonSlayer">WIP</button>
<script>
  class Dragon {
    constructor(mutation, horns, heads, type, degree) {
      if (mutation.isDragon()) {
        this.mutation = mutation;
      } else if (mutation.isInteger()) {
        this.mutation = D(null, mutation, [], null, null);
      } else if (mutation.isMyriad()) {
        this.mutation = D(null, 0, [mutation], null, null);
      } else {
        this.mutation = null;
      }
      
      if (horns.isInteger()) {
        this.horns = horns;
      } else {
        this.horns = 0;
      }
      
      let headsStorage = [];
      for (let i = 0; i < heads.length; i++) {
        if (heads[i].isInteger()) {
          if (i = 0) {
            headsStorage.push(D(null, heads[i], [], null, null));
          } else {
            headsStorage.push(D(0, heads[i], [], null, null));
          }
        } else if (heads[i].isArray()) {
          if (i = 0) {
            headsStorage.push(D(null, 0, [...heads[i]], null, null)); 
          } else {
            headsStorage.push(D(0, 0, [...heads[i], null, null));
          }
        } else if (heads[i].isDragon() || heads[i].isMyriad()) {
          headsStorage.push(heads[i]);
        }
      }
      this.heads = [...headsStorage];
      
      if (type = null) {
        this.type = "";
      } else {
        this.type = String(type);
      }
      
      if (degree.isDragon() || degree.isMyriad()) {
        this.degree = mutation;
      }
      } else {
        this.degree = D(null, 0, [], null, null);
      }
      
      this.isDragon = true;
    }
  }
  
  class Myriad {
    constructor(rank, operator, operand) {
      if (rank.isInteger()) {
        this.rank = [[D(null, rank, [], null, null)]];
      } else if (rank.isArray()) {
        let rankStorage = [];
        for (let i = 0; i < rank[i].length; i++) {
          if (rank[i].isInteger()) {
            if (i = 0) {
              rankStorage.push(D(null, rank[i], [], null, null));
            } else {
              rankStorage.push(D(0, rank[i], [], null, null));
            }
          } else if (rank[i].isArray()) {
            if (i = 0) {
              rankStorage.push(D(null, 0, [...rank[i]], null, null)); 
            } else {
              rankStorage.push(D(0, 0, [...rank[i], null, null));
            }
          } else if (rank[i].isDragon() || rank[i].isMyriad()) {
            rankStorage.push(rank[i]);
          }
        }
        this.rank = [...rankStorage];
      } else {
        this.rank = [[0]]
      }

      if (operator.isInteger()) {
        this.operator = D(null, operator, [], null, null);
      } else if (operator.isArray()) {
        this.operator = D(null, 0, [...operand], null, null);
      } else {
        this.operator = operator;
      }
    
      if (operand.isInteger()) {
        this.operand = D(null, operand, [], null, null);
      } else if (operand.isArray()) {
        this.operand = D(null, 0, [...operand], null, null);
      }
      
      this.isMyriad = true;
    }
  }

  function integerToDragon(value) {
    return D(null, value, [], null, null);
  }

  function myriadToDragon(value) {
    return D(null, 0, [value], null, null);
  }
  
  function D(mut, hrn, hds, typ) {
    return new Dragon(mut, hrn, hds, typ);
  }

  function M(rnk, opt, opd) {
    return new Myriad(rnk, opt, opd);
  }
  function slayDragon(a, dragon, b) {
    let dragonOutput = "";
    
    let dragonSlain;
    if (dragon.isInteger()) {
      dragonSlain = D(null, dragon, [], null, null);
    } else if (dragon.isArray()) {
      let dragonStorage = [];
        for (let i = 0; i < dragon[i].length; i++) {
          if (dragon[i].isInteger()) {
            if (i = 0) {
              dragonStorage.push(D(null, dragon[i], [], null, null));
            } else {
              dragonStorage.push(D(0, dragon[i], [], null, null));
            }
          } else if (dragon[i].isArray()) {
            if (i = 0) {
              dragonStorage.push(D(null, 0, [...dragon[i]], null, null)); 
            } else {
              dragonStorage.push(D(0, 0, [...dragon[i], null, null));
            }
          } else if (dragon[i].isDragon() || dragon[i].isMyriad()) {
            dragonStorage.push(dragon[i]);
          }
        }
        dragonSlain = [...dragonStorage];
    } else if (dragon.isMyriad()) {
      dragonSlain = [null, 0, [dragon], null, null];
    } else if (dragon.isDragon()) {
      dragonSlain = dragon;
    } else {
      dragonSlain = D(null, 0, [], null, null);
    }
    
    if (a == 1) {
      return String(1);
    } else if (b == 1) {
      return String(a);
    } else if (dragonSlain.mutation == null && dragonSlain.horns == 0 && dragonSlain.heads == [] && dragonSlain.type == "") {
      return a + "^" + b;
    } else {
      for (let i = 0; i = b; i++) {
        if (i == 0) {
          dragonOutput = dragonOutput + a;
        } else {
          dragonOutput = dragonOutput + a + dragonToString(dragonSlain.evaluate(b, b, 0, []));
        }
      }
    }

    return dragonOutput;
  }
</script>
